services:
  - type: web
    name: agroguardian-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker -w 1 -b 0.0.0.0:$PORT backend.main:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: MODEL_VERSION
        value: 1.0.0

  - type: web
    name: agroguardian-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run dashboard/app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8